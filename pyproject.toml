[project]
name = "sap-odata-client"
version = "0.1.0"
description = "Async SAP S/4HANA OData client with OAuth2 + CSRF support."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Your Name" }]
dependencies = ["httpx>=0.27.0"]

keywords = ["sap", "odata", "s4hana", "httpx", "async"]

[project.urls]
Homepage = "https://github.com/0x0pharaoh/sap-odata-client"
Repository = "https://github.com/0x0pharaoh/sap-odata-client"
Issues = "https://github.com/0x0pharaoh/sap-odata-client/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sap_odata_client"]

[tool.hatch.build.targets.sdist]
include = ["sap_odata_client"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F"]

[tool.pytest.ini_options]
addopts = "-ra -q"
pythonpath = ["sap_odata_client"]
