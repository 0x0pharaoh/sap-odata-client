[project]
name = "sap-odata-client"
version = "0.1.0"
description = "Async SAP S/4HANA OData client with OAuth2 + CSRF support."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Your Name" }
]

# Runtime dependencies
dependencies = [
    "httpx>=0.27.0",
]

# Optional keywords for PyPI search
keywords = [
    "sap",
    "odata",
    "s4hana",
    "salesorder",
    "httpx",
    "async",
]

[project.urls]
Homepage = "https://github.com/yourname/sap-odata-client"
Repository = "https://github.com/yourname/sap-odata-client"
Issues = "https://github.com/yourname/sap-odata-client/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Optional: tool configs
[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F"]

[tool.pytest.ini_options]
addopts = "-ra -q"
pythonpath = ["sap_client"]
