[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sap-odata-client"
version = "0.1.1"
description = "Async SAP S/4HANA OData client with OAuth2 + CSRF support."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "0x0pharaoh" }]
dependencies = [
    "httpx>=0.27.0"
]

[tool.hatch.build.targets.wheel]
packages = ["sap_odata_client"]

[tool.hatch.build.targets.sdist]
include = ["sap_odata_client"]
